[project]
name = "qa-auto-engineer-python-project-314"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.16.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "selenium>=4.46.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"

[tool.setuptools.packages.find]
include = ["pages*"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
